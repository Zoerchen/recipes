<!DOCTYPE html> <!-- sagt dem Browser: das ist HTML5 -->
<html> <!-- das Wurzelelement, alles sitzt darin -->

<head> <!-- unsichtbare Infos (Titel, Zeichensatz usw.) -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> <!-- Icon-Liberary -->

    <link rel="stylesheet" href="css/utilities.css"> <!-- Link zu utilities-->

    <link rel="stylesheet" href="css/styles.css"> <!-- Link zu styles-->

    <link rel="icon" type="./jpg" href="images/favicon.JPG"> <!-- Browsericon  typisch png 16×16 oder 32×32 Pixel-->  

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> <!-- Supabase JavaScript Library benutzen -->
    
    <meta charset="UTF-8"> <!-- welche Zeichen der Browser darstellen soll  -->    
    
    <title>Rezepte</title> <!-- Titel der beim Tab angezeigt wird-->

</head>


<body> <!-- alles was der Benutzer sieht -->
--
<!------------------------------------------------------------------------------------------>
<!---------------------------- Login ------------------------------------------------------->
<!------------------------------------------------------------------------------------------>

<div id="login" class="hidden modal-overlay">
    <div class="modal blue grid-login">
        <div class="grid-login">
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Passwort">
        </div>
        <div class="space-login">
            <i id="not-sign-in" class="fa fa-long-arrow-left clickable"></i>
            <i id="login-btn" class="fa fa fa-unlock-alt clickable"></i> 
        </div>     
    </div>
</div>

<div id="website">
<!------------------------------------------------------------------------------------------>
<!---------------------------- Header ------------------------------------------------------>
<!------------------------------------------------------------------------------------------>

    <div id="header" class="blue">

        <!------ oberer Teil des Headers ------------->
        <div id="header-main">
                <div id="header-left">
                    <i id="search-icon" class="fa fa-search clickable"></i>
                </div>
                <div id="header-middle">
                    <h3 id="header-title">Rezepte</h3>
                </div>
                <div id="header-right">
                    <i id="menu-icon"class="fa fa-bars clickable"></i>
                </div>
        </div>

        <!------ unterer Teil des Headers ------------>
        <!------ Suchfeld ------>
        <div id="search-field"class="hidden">
            <input id="search-value" placeholder="Gib einen Suchbegriff ein...">
        </div>
        <!-------- Menu -------->
        <div id="menu"class="hidden">
            <!--- Menu: Rezepteübersicht --->
            <div id="menu-book">
                <div>
                    <i id="to-shopping-list" class="fa fa-shopping-basket clickable"></i>
                </div>
                <div id="to-new-recipe-div">
                    <i id="to-new-recipe" class="fa fa-plus clickable"></i>
                </div>
                <div >
                    <i id="back-to-top" class="fa fa-chevron-up clickable"></i>
                </div>
                <div>
                    <i id="log" class="fa fa-sign-in clickable"></i>
                </div>
            </div>
            <!--- Menu: Detailansicht --->
            <div id="menu-detail"class="hidden">
                <div>
                    <i id="previous" class="fa fa-chevron-left clickable"></i> 
                </div>
                <div>
                    <i id="back-to-recipes" class="fa fa-book clickable"></i>
                </div>
                <div>
                    <i id="next" class="fa fa-chevron-right clickable"></i>
                </div>
                <div id="edit-div">
                    <i id="edit" class="fa fa-pencil clickable"></i>
                </div>
                <div>
                    <i id="external-link" class="fa fa-external-link clickable"></i>
                </div>
                <div>
                    <i id="to-shopping-list-detail" class="fa fa-shopping-basket clickable"></i>
                </div>
            </div>
            <!--- Menu: Bearbeitungsansicht --->
            <div id="menu-edit"class="hidden">
                <div>
                    <i id="save" class="fa fa-check clickable"></i> 
                </div>
                <div>
                    <i id="undo" class="fa fa-undo clickable"></i> 
                </div>
                <div>
                    <i id="delete" class="fa fa-trash clickable"></i> 
                </div>
            </div>
            <!--- Menu: Neues-Rezept-Seite --->
            <div id="menu-scrape"class="hidden">
                <div></div>
                <div>
                    <i id="back-to-book" class="fa fa-book clickable"></i> 
                </div>
                <div></div>
            </div>
        </div>
    </div>



<!------------------------------------------------------------------------------------------>
<!---------------------------- Hauptbereich ------------------------------------------------>
<!------------------------------------------------------------------------------------------>   

    <div id="main"> 

<!------------------------------------------------------------------------------------------>
<!---------------------------- Rezepteübersicht -------------------------------------------->
<!------------------------------------------------------------------------------------------>

        
        <div id="book" class="grid-container"></div> <!-- Container in dem Rezepte gezeigt werden-->

<!------------------------------------------------------------------------------------------>
<!---------------------------- Detailansicht ----------------------------------------------->
<!------------------------------------------------------------------------------------------>

        
        <div id="detail-area" class="hidden">

            <div id="detail-title"></div>
            <div id="detail-url"></div>
            <div id="detail-image"></div>
            <div id="detail-description"></div>
            <div id="detail-ingredients"></div>
            <div id="detail-yields"></div>
            <div id="detail-instructions"></div>
            <div id="detail-time"></div>
            <div id="detail-category"></div>
            <div id="detail-notes"></div>
            <div id="detail-created"></div>
            <div id="detail-changed"></div>

        </div>

<!------------------------------------------------------------------------------------------>
<!------------------------- neues Rezept - Seite ------------------------------------------->
<!------------------------------------------------------------------------------------------>

    <div id="new-recipe" class="hidden modal-overlay">
        <div id="new-recipe-modal" class="modal blue grid-login">
            <div class="grid-login">
                <div id="new-recipe-manuell" class="space-login clickable">
                    <p>Gib ein neues Rezept manuell ein:</p>
                    <i class="fa fa-pencil"></i>
                </div>
                <div class="space-login">
                    <div></div>
                    <p>oder</p>
                    <div></div>
                </div>
                <div class="space-login">
                    <p> Lade das Rezept über einen Link runter:</p>
                </div>
                <div class="space-login">
                    <input id="scrape-url" placeholder="URL...">
                    <i id="scrape-button" class="fa fa-download clickable"></i>
                </div>
                <div class="space-login">
                    <div></div>
                    <i id="back" class="fa fa-long-arrow-left clickable"></i>
                    <div></div>
                </div>
                
            </div>
            <p id="scrape-errors"></p>
        </div>
    </div>

    <div id="waiting" class="hidden modal-overlay">
        <div id="waiting-modal" class="modal blue">
                <p id="waiting-text"></p>
                <div class="space-login">
                    <i id="close-waiting" class="fa fa-long-arrow-left clickable hidden"></i>
                    <i  id ="to-recipe" class="fa fa-eye clickable hidden"></i>
                </div>
        </div>
    </div>


<!------------------------------------------------------------------------------------------>
<!---------------------------- Bearbeitungsmodus ------------------------------------------->
<!------------------------------------------------------------------------------------------>

        <div id="edit-area" class="hidden">

            <div id="edit-title">
                <p>Titel:</p>
                <input id="edit-title-input">
            </div>
            <div id="edit-url">
                <p>URL:</p>
                <input id="edit-url-input">
            </div>
            <div id="edit-image">
                <p>Bild:</p>
                <input id="edit-image-input">
            </div>
            <div id="edit-description">
                <p>Beschreibung:</p>
                <input id="edit-description-input">
            </div>
            <div id="edit-ingredients">
                <p>Zutaten:</p>
                <input id="edit-ingredients-input">
            </div>
            <div id="edit-yields">
                <p>Portionen:</p>
                <input id="edit-yields-input">
            </div>
            <div id="edit-instructions">
                <p>Anweisungen:</p>
                <input id="edit-instructions-input">
            </div>
            <div id="edit-time">
                <p>Zeit:</p>
                <input id="edit-time-input">
            </div>
            <div id="edit-category">
                <p>Kategorien:</p>
                <input id="edit-category-input">
            </div>
            <div id="edit-notes">
                <p>weitere Infos:</p>
                <input id="edit-notes-input">
            </div>
            <div id="edit-created">
                <p>Erstellt am:</p>
                <input id="edit-created-input">
            </div>
            <div id="edit-changed">
                <p>Geändert am:</p>
                <input id="edit-changed-input">
            </div>

        </div>

<!------------------------------------------------------------------------------------------>
<!---------------------------- Overlay ----------------------------------------------------->
<!------------------------------------------------------------------------------------------>


        <div id="confirm-modal" class="modal-overlay hidden">
            <div class="modal">
                <p>Willst du wirklich abbrechen?</p>
                <button id="modal-ja">Ja</button>
                <button id="modal-nein">Nein</button>
            </div>
        </div>

    </div>
</div>
    
<!------------------------------------------------------------------------------------->
<!----------------- Einbinden von JavaSkript-Skripten --------------------------------->
<!------------------------------------------------------------------------------------->

<script src="js/main.js"></script> 
<script src="js/auth.js"></script> 
<script src="js/header.js"></script> 
<script src="js/scraping.js"></script>

</body>

</html>

<!--
<h1> bis <h6> – Überschriften (h1 = groß, h6 = klein)
<p> – ein Textabsatz
<div> – ein unsichtbarer Container zum Gruppieren von Elementen
<button> – ein klickbarer Button
<input> – ein Eingabefeld
  -->
