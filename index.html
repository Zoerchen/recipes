    <style> /* CSS */

        :root /*Definiere Farben, Schriftart */
        {
            --lila: rgb(125, 21, 154);
            --hellblau: rgb(109, 186, 219);
            --dunkelblau: rgb(75, 66, 200);
            --dunkelblau-akzent: rgb(47, 39, 156);
            --rosa: rgb(255, 147, 232);
            --hintergrund: rgb(210, 128, 232);
            --schriftart: "Times New Roman", Times, serif;
        }

        body /* globale Einstellungen */
        {
            color: var(--lila); /*Schrift-Farbe*/
            font-family: var(--schriftart); /*Schrift-Art*/
            background-color: var(--hintergrund) /*Hintergrundsfarbe*/
        }

        button /* Style des Buttons */
        {
            background-color: var(--hellblau);
            color: var(--dunkelblau);
            padding: 10px;
            box-shadow: 5px 5px  var(--dunkelblau);
            border-radius: 10px;
            border: none;
            cursor: pointer; /* Mauszeiger wird zur Hand beim Hover */
            transition: transform 0.1s, box-shadow 0.1s;
            font-family: var(--schriftart);
        }

        button:active /* Style des Buttons, wenn er gedrückt wird*/
        {
            box-shadow: none;
            transform: translateY(2px);
            
        }

        button:hover
        {
            box-shadow: 3px 3px var(--dunkelblau);
            transform: translateY(2px);
        }


        .hidden /* Klasse von Elementen die versteckt sind*/
        {
            display: none !important;
        }

        .clickable /* Klasse von Elementen, die klickbar sind*/
        {
            cursor: pointer;
        }

        .clickable:active /* Klasse von Elementen, die klickbar sind, in aktivierten Zustand*/
        {
            color: var(--dunkelblau-akzent);
            transform: translateY(1px);
        }

/*!!!*/
/********* Modal komplett überarbeiten************/
        .modal-overlay
        {
            position: fixed;      /* bleibt immer im Sichtfeld, auch beim Scrollen */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(210, 128, 232, 0.5);  /* halbtransparentes Schwarz */
            display: flex;
            align-items: center;
            justify-content: center;  /* Modal-Inhalt zentrieren */
            z-index: 999;             /* über allem anderen */
        }

        .modal
        {
            background: rgb(210, 128, 232);
            box-shadow: 5px 5px rgb(125, 21, 154);
            padding: 2rem;
            border-radius: 10px;
            text-align: center;
        }


        .blue /*Klasse von Elementen in blauen Boxen*/
        {
            box-shadow: 5px 5px var(--dunkelblau);
            background-color: var(--hellblau);
            color: var(--dunkelblau) !important;
        }

        .blue:hover
        {
            box-shadow: 3px 3px var(--dunkelblau);
            transform: translateY(2px);
        }

        ::placeholder /*Placeholder-Style (Input)*/
        { 
        color: var(--dunkelblau);
        opacity: 1; /* Firefox */
        font-family: var(--schriftart);
        }

        .scrollable::-webkit-scrollbar {
            width: 6px; /* schmale Scrollbar */
        }

        .scrollable::-webkit-scrollbar-track {
            background: transparent; /* Hintergrund unsichtbar */
        }

        .scrollable::-webkit-scrollbar-thumb {
            background: rgb(125, 21, 154); /* lila Farbe */
            border-radius: 10px; /* abgerundet */
        }

        /******************************************************************/ 
        /********************* Header *************************************/  
        /******************************************************************/
        
        #header /*Style von Header*/
        { 
            
            position: fixed;
            z-index: 100;
            top: 10px;
            left: 500px;
            right: 500px;
            transition: padding 0.3s, font-size 0.3s;
        }

        .header-small /*reduzierte Form des Headers*/
        { 
            padding: 0px 5px; 
            font-size: 10px;
        }

        #header-main
        {
            display: flex;
            align-items: center;
            justify-content: space-between; /* links, mitte, rechts */
            padding: 0px 20px; /*oben-unten links-rechts*/
        }



        #search-field
        {
            
            height: 20px;
            padding: 0px 10px  5px; /*oben links-rechts unten*/
        }

        #search-value
        {
            width: 100%;

            height: 20px;
            
            background: transparent;

            text-indent: 5px;
        }

        #search-value:focus {
        border-color: rgb(125, 21, 154);

        }


        .search-mode
        {
            border-radius: 0px 0px 10px 10px;    
        }

        #menu-book, #menu-detail, #menu-edit, #menu-scrape
        {
            display: flex;
            align-items: center;
            justify-content: space-between; /* links, mitte, rechts */
            padding: 0px 20px  5px; /*oben links-rechts unten*/
        }
        


        /********************* Hauptansicht: Rezepte übersicht ****************************/ 
        
        #main
        {
            padding-top: 85px; /* ungefähr die Höhe des Headers */

        }

        .card /* Style von Rezeptekarten*/
        {
            border-radius: 10px;
            aspect-ratio: 1; /*Quadration*/
            background-color: rgb(255, 147, 232);
            box-shadow: 5px 5px rgb(125, 21, 154);
            cursor: pointer; /* Mauszeiger wird zur Hand beim Hover */
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .card:active /* Style der Karte, wenn sie gedrückt wird*/
        {
            box-shadow: none !important;
            transform: translateY(5px) !important;
            
        }

        .card:hover
        {
            box-shadow: 3px 3px rgb(125, 21, 154);
            transform: translateY(2px);
        }

        

        .card img /* Einstellungen für die Bilder auf den Karten*/
        {
            width: 100%;        /* Bild füllt die Kartenbreite */
            height: 70%;      /* feste Höhe */
            object-fit: cover;  /* Bild wird zugeschnitten, nicht verzerrt */
            border-radius: 10px 10px 0px 0px;
            background-color: rgb(109, 186, 219);
            object-position: center;
            
        }

        .card h2
        {
            padding-left: 10px;
        }

        .card h2:hover::after {
            content: attr(data-tooltip);
            background: rgba(125, 21, 154);
            color: rgb(255, 147, 232);
            position: absolute;
            white-space-collapse: break-spaces;
            width: fit-content;
            font-size: 12px;
        }

    
        .grid-container /* Grid stlye für die Rezeptekarten*/
        {
            display: grid; /*definiert grid, inline-grid oder grid*/
            grid-template-columns: 1fr 1fr 1fr 1fr;
            padding: 30px;
            grid-gap: 30px;
        }

    <script> // Javaskript

////////////////////////////////////////////////////////////////////////////////////////////////////////////////
////////////////// globale Variablen ///////////////////////////////////////////////////////////////////////////
////////////////////////////////////////////////////////////////////////////////////////////////////////////////

        let recipes_all = []; // alle Rezepte
        let currentIndex = 0; // Der Index von recipe_all des ausgewählten Rezeptes
        let recipes_search = []; // alle Rezepte, die einem Suchkriterium entsprechen
        let isNew = false; //Rezept ist neu

////////////////////////////////////////////////////////////////////////////////////////////////////////////////
/////////////////////// Header /////////////////////////////////////////////////////////////////////////////////
////////////////////////////////////////////////////////////////////////////////////////////////////////////////

        /**
         * Verkleinert den Header, beim Scrollen nach unten.
         */
        window.addEventListener("scroll", function() {

            //Wenn runter gescrollt wird, mache eine kleine Version des Headers
            if (window.scrollY > 30)
            {
                document.getElementById("header").classList.add("header-small");    
            }
            else
            {
                document.getElementById("header").classList.remove("header-small");
            }
        })


        ////////////// Suchen /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

        /**
         * Alles was passiert, wenn auf das Suchicon im Header geklickt wird.
         */
        document.getElementById("header-left").addEventListener("click", function() {

            // Nach oben Springen, wenn die  neuSuche aktiviert wird
            if (document.getElementById("header").classList.contains("header-small")
                && (document.getElementById("search-field").classList.contains("hidden"))
            ) {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            }

            //Schließen der Suche -> Suchfeld zurücksetzen, alle Rezepte laden
            if (document.getElementById("search-value").value != "") {
                
                //Suchbegriff leeren
                document.getElementById("search-value").value = "";
                
                //Nach oben springen
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });

                // Den Container einmal leeren, damit die Rezepte nicht doppelt angezeigt wernden
                document.getElementById("book").innerHTML = ""

                //Rezepte die der Suchanfrage entsprechen anzeigen
                recipes_all.forEach(loadRecipes); 
            }

            //Menu schließen, wenn es gerade geöffnet ist -> immer nur eins von beiden Offen
            if (!(document.getElementById("menu").classList.contains("hidden"))) 
            {
                closeMenu();
            }

            //Das Suchfeld öffnen und schließen
            if (document.getElementById("search-field").classList.contains("hidden"))
            {
                openSearch()
            }
            else
            {
                closeSearch()
            }

            //Automatisch ins Suchfeld fokussieren
            document.getElementById('search-value').focus();
        })

        /**
         * Überprüft, ob ein Suchbegriff in den Titeln der Rezepte vorhanden ist,
         * und updated die Übersicht der Rezepte nach diesem Kriterium.
         */
        document.getElementById("search-value").addEventListener("input", function() {

            //Bei jeder Änderung im Suchfeld suchbegriff laden
            const search_term = document.getElementById("search-value").value;

            recipes_search = []; //leeren

            //Durch alle Rezepte iterieren und überprüfen ob Suchwort im Titel enthalten ist
            for (const recipe of recipes_all)
            {
                if (recipe.title.toLowerCase().includes(search_term.toLowerCase()))  //Wenn der Rezeptename den suchbegriff beinhaltet ()  
                {
                    recipes_search.push(recipe); //Zu den Rezepten die der Suchanfrage entsprechen hinzufügen    
                }
            }

            // Den Container einmal leeren, damit die Rezepte nicht doppelt angezeigt wernden
            document.getElementById("book").innerHTML = ""

            //Rezepte die der Suchanfrage entsprechen anzeigen
            recipes_search.forEach(loadRecipes);    
        })


        /**
         * Öffne das Suchfeld.
         */
        function openSearch()
        {
            document.getElementById("search-field").classList.remove("hidden");
            document.getElementById("header").classList.add("search-mode");
            document.getElementById("search-icon").classList.add("fa-times");
            document.getElementById("search-icon").classList.remove("fa-search");
        }

        /**
         * Schließe das Suchfeld.
         */
        function closeSearch()
        {
            document.getElementById("search-field").classList.add("hidden");
            document.getElementById("header").classList.remove("search-mode");
            document.getElementById("search-icon").classList.remove("fa-times");
            document.getElementById("search-icon").classList.add("fa-search");
                
            
        }

        /**
         * Verstecke das Suchfeld.
         */
        function hideSearch()
        {
            closeSearch()
            document.getElementById("search-icon").classList.add("hidden"); 
        }

        /**
         * Zeige wieder das Suchfeld.
         */
        function showSearch()
        {
            document.getElementById("search-icon").classList.remove("hidden");
        }


        ////////////// Menu /////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////

        /**
         * Alles was passiert, wenn auf das Menu-Icon im Header geklickt wird,
         */
        document.getElementById("header-right").addEventListener("click", function() {

            //Wenn das Suchfeld offen ist, dieses schließen
            if (!(document.getElementById("search-field").classList.contains("hidden"))) 
            {
                closeSearch();
            }

            //Das Menu öffnen und Schließen
            if (document.getElementById("menu").classList.contains("hidden")) 
            {
                openMenu();
            }
            else
            {
                closeMenu();
            }

        })

        
        /**
         * Das Menu öffnen.
         */
        function openMenu()
        {   
            document.getElementById("menu").classList.remove("hidden");
            document.getElementById("header").classList.add("search-mode");
            document.getElementById("menu-icon").classList.add("fa-times");
            document.getElementById("menu-icon").classList.remove("fa-bars");
        }
        
        /**
         * Das Menu schließen.
         */
        function closeMenu()
        {   
            document.getElementById("menu").classList.add("hidden");
            document.getElementById("header").classList.remove("search-mode");
            document.getElementById("menu-icon").classList.remove("fa-times");
            document.getElementById("menu-icon").classList.add("fa-bars");
        }

        /**
         * Das Menu verstecken.
         */
        function hideMenu()
        {   
            closeMenu();
            document.getElementById("menu-icon").classList.add("hidden");

        }

        /**
         * Das Menu zeigen
         */
        function showMenu()
        {   
            document.getElementById("menu-icon").classList.remove("hidden");

        }


        ///////// Menu-Icons ///////////////////////////////////////////////////////////////////////////////////

        /**
         * Klicken des Menu-Icons: Ein neues Rezept hinzufügen.
         */
        document.getElementById("to-new-recipe").addEventListener("click", function()
        {   
            //Ändere die Überschrift
            document.getElementById("header-title").textContent = "neues Rezept hinzufügen";

            //Nach oben Scrollen (Da neue Ansicht geöffnet wird)
            window.scrollTo(0, 0)

            //Rezepteübersicht ausblenden, neue Rezepte-Seite einblenden
            document.getElementById("book").classList.add("hidden");
            document.getElementById("new-recipe").classList.remove("hidden");

            //Suche und Menu ausblenden
            hideSearch();
            hideMenu();

            //Zurückgeh Icon einblenden
            document.getElementById("menu-book").classList.add("hidden");
            document.getElementById("menu-scrape").classList.remove("hidden");

            openMenu();

        })

        /**
         * Klicken des Menu-Icons: Zurück zur Rezepteübersicht von der neues Rezept-Seite
         */
        document.getElementById("back-to-book").addEventListener("click", function()
        { 
            //Ändere die Überschrift
            document.getElementById("header-title").textContent = "Rezepte";

            //Nach oben Scrollen (Da neue Ansicht geöffnet wird)
            window.scrollTo(0, 0)

            //Rezepteübersicht einblenden, neue Rezepte-Seite ausblenden
            document.getElementById("book").classList.remove("hidden");
            document.getElementById("new-recipe").classList.add("hidden");

            //Suche und Menu ausblenden
            showSearch();
            showMenu();

            //Richtige Menu-Icons einblenden einblenden
            document.getElementById("menu-book").classList.remove("hidden");
            document.getElementById("menu-scrape").classList.add("hidden");

            //Menu schließen
            closeMenu();
            
            
            //URL clearen 
            document.getElementById("scrape-url").value = ""; 
        })    

        
        
        
        /**
         * Klicken des Menu-Icons: Zurück nach oben.
         */
        document.getElementById("back-to-top").addEventListener("click", function()
        {   
            //Menu schließen
            closeMenu();
            
            //Nach oben scrollen
            window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });

        })
        
        /**
         * Klicken des Menu-Icons: Zur Shoppingliste.
         */
        document.getElementById("to-shopping-list").addEventListener("click", function()
        {   
            alert("In Arbeit.");
        })

        ///////// Detail-Menu-Items ///////////////////////////////////////////////////////////////////////////////////

        /**
         * Klicken von <: Vorheriges Rezept anzeigen.
         */
        document.getElementById("previous").addEventListener("click", function()
        {   
            //Den Index auf den Vorherigen setzen (Grenzen werden beachtet)
            currentIndex = Math.max(0, currentIndex - 1); //Vorherigen Index aufrufen (mit Grenze)
            
            //Detailansicht leeren
            clearDetails() 
            
            //Detailansicht des neuen Rezeptes laden
            detailRecipe(currentIndex);
        })

        /**
         * Klicken von Buch-Icon: Zurück zur Rezepteübersicht.
         */
        document.getElementById("back-to-recipes").addEventListener("click", function()
        {   
            detailToRecipes();
        })

        /**
         * Klicken von >: Nächstes Rezept anzeigen.
         */
        document.getElementById("next").addEventListener("click", function()
        {   
            //Den Index auf den Nächsten setzen (Grenzen werden beachtet)
            currentIndex = Math.min(currentIndex + 1, recipes_all.length - 1);
            
            //Detailansicht leeren
            clearDetails() 
            
            //Detailansicht des neuen Rezeptes laden
            detailRecipe(currentIndex);
        })

        /**
         * Klicken von edit-Icon: Das aktuelle Rezept editieren.
         */
        document.getElementById("edit").addEventListener("click", function()
        {   
        

            //Ändere die Überschrift
            document.getElementById("header-title").textContent = "Rezept bearbeiten";

            //öffne den Edit-Mode
            openEditMode();

            //Lade das aktuelle Rezept in den Edit-Mode
            loadRecipeToEditMode(currentIndex);

            
        })

        /**
         * Klicken von Link-Icon: Den externen Link öffnen.
         */
        document.getElementById("external-link").addEventListener("click", function()
        {   
            //pass (wird in detailRecipes() angehangen)
        })

        /**
         * Klicken von EInkaufs-Icon: Die Einkaufsliste öffnen.
         */
        document.getElementById("to-shopping-list-detail").addEventListener("click", function()
        {

        /**
         * Das bearbeitete oder neue Rezept sichern.
         */
        async function saveRecipe() {

            //Den Input auslesen
            const title = document.getElementById("edit-title-input").value;
            const url = document.getElementById("edit-url-input").value;
            const image = document.getElementById("edit-image-input").value;
            const description = document.getElementById("edit-description-input").value;
            const ingredients = document.getElementById("edit-ingredients-input").value;
            const yields = document.getElementById("edit-yields-input").value;
            const instructions = document.getElementById("edit-instructions-input").value;
            const time = document.getElementById("edit-time-input").value;
            const category = document.getElementById("edit-category-input").value;
            const notes = document.getElementById("edit-notes-input").value;
            const created = document.getElementById("edit-created-input").value;
            const changed = document.getElementById("edit-changed-input").value;

            let currentID;

            //Wenn es ein neues Rezept ist, neu in die Datenbank einfügen
            if (isNew)
            {
                // In Datenbank schreiben
                const { data, error } = await db //await: Warte bis Supabase reagiert
                    .from('recipes')
                    .insert({
                            title : title, url : url, image : image,
                            description : description, ingredients : ingredients, yields : yields,
                            instructions : instructions, time : time, category : category,
                            notes : notes, created : created, changed : changed
                        })
                    .select()
                    .single();
                console.log(error);
                
                //die ID des eingefügten Rezeptes laden
                currentID = data.id;
                
                //Variable zurücksetzen
                isNew = false;
            }
            //Wenn es eine Bearbeitung ist, die Datenbank updaten
            else
            {
                //Aktuelle ID merken
                currentID = recipes_all[currentIndex].id

                // In Datenbank schreiben
                const { data, error } = await db //await: Warte bis Supabase reagiert
                    .from('recipes')
                    .update({
                            title : title, url : url, image : image,
                            description : description, ingredients : ingredients, yields : yields,
                            instructions : instructions, time : time, category : category,
                            notes : notes, created : created, changed : changed
                        })
                    .eq('id', currentID)
            }

//!!!
// er lädt immer kurz ein anderes Rezept
//es gibt eine kleine verzögerung die ich nicht finden kann
//!!!

            //lokale Rezeptdaten neuladen
            await updateRecipes();
            console.log(recipes_all);

            //Den Index aktualisieren (falls er sich geändert hat, durch andere Reihenfolge in db)
            currentIndex = recipes_all.findIndex(r => r.id === currentID);
     
            // Editierfelder leeren
            emptyEditMode();

            //Detailansicht updaten
            detailRecipe(currentIndex);

        }
